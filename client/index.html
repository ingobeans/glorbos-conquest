<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>glorbo's conquest</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <script src="client.js" defer></script>
    <div id="game-grid"></div>
    <div style="--count:5;" id="player-deck">
        <div onmouseover="mouseCard(this)" style="--index:0;z-index:0;" class="held-card"></div>
        <div onmouseover="mouseCard(this)" style="--index:1;z-index:0;" class="held-card"></div>
        <div onmouseover="mouseCard(this)" style="--index:2;z-index:0;" class="held-card"></div>
        <div onmouseover="mouseCard(this)" style="--index:3;z-index:0;" class="held-card"></div>
        <div onmouseover="mouseCard(this)" style="--index:4;z-index:0;" class="held-card"></div>
    </div>
</body>

</html>
